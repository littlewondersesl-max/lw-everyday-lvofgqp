<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Alphabet Lights</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#151a22}
body{font-family:"Baloo 2","Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:6px;
 background:linear-gradient(#0a0d1499,#0a0d1466),#151a22 url(bg.webp) center/cover no-repeat}
#top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;flex:none}
#title{font-weight:800;font-size:clamp(20px,3vw,30px);line-height:1;margin:0 6px;color:#fff;text-shadow:0 0 6px #ff3fa4,0 0 16px #ff3fa4}
a.home{color:#fff;font-weight:800;text-decoration:none;font-size:clamp(13px,1.5vw,16px);background:#ffffff22;border-radius:14px;padding:6px 10px}
.seg{display:flex;background:#ffffff1f;border-radius:16px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:clamp(12px,1.4vw,16px);font-weight:800;border:0;border-radius:13px;padding:5px 9px;min-height:36px;background:none;color:#e8e3f5;cursor:pointer;touch-action:manipulation}
.seg button.on{background:#f28bb0;color:#fff;box-shadow:0 3px 0 #c8628a}
button.ctl{font:inherit;font-size:clamp(14px,1.6vw,18px);font-weight:800;border:0;border-radius:18px;padding:6px 14px;min-height:42px;background:#9cc8f0;color:#fff;cursor:pointer;box-shadow:0 4px 0 #6fa3d6;touch-action:manipulation}
button.ctl:active{transform:translateY(3px);box-shadow:0 1px 0 #6fa3d6}
button.go{background:#5fc29a;box-shadow:0 4px 0 #3e9c77}
button.ok{background:#2fbf5b;box-shadow:0 4px 0 #1f8f42}
button.no{background:#e5394a;box-shadow:0 4px 0 #b02232}
#score{font-weight:800;background:#ffffff22;border-radius:14px;padding:6px 12px;font-size:clamp(13px,1.5vw,17px);white-space:nowrap}
#main{flex:1;min-height:0;display:flex;gap:6px}
#stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;container-type:size}
.row{position:relative;display:flex;justify-content:center;align-items:flex-end;height:31%;padding:0 2%}
.row::after{content:"";position:absolute;left:0;right:0;bottom:-3.2cqh;height:5cqh;background:url(shelf.webp) center/100% 100% no-repeat;z-index:0;filter:brightness(.85)}
.L{position:relative;z-index:1;width:calc(100cqw/9.6);height:100%;display:flex;justify-content:center;align-items:flex-end}
.L img{position:absolute;bottom:0;max-width:96%;max-height:100%;object-fit:contain}
.L .off{filter:brightness(.62) saturate(.4)}
.L .on{opacity:0;filter:drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 12px var(--c)) brightness(1.15) saturate(1.3)}
.L.lit .on{animation:flick .55s steps(1,end) forwards}
.L.stay .on{opacity:1}
.L.out .on{animation:flout .35s steps(1,end) forwards}
@keyframes flick{0%{opacity:0}10%{opacity:1}18%{opacity:.15}28%{opacity:1}36%{opacity:.3}46%{opacity:1}100%{opacity:1}}
@keyframes flout{0%{opacity:1}25%{opacity:.2}45%{opacity:.9}65%{opacity:.1}80%{opacity:.6}100%{opacity:0}}
#side{position:relative;z-index:5;display:none;width:clamp(150px,20vw,240px);flex:none;background:#0f1320d9;border-radius:18px;padding:10px;overflow:auto}
#side.show{display:block}
#side.closed{width:44px;padding:6px;overflow:hidden}
#side.closed > :not(#tog){display:none}
#side h3{margin:2px 0 6px;font-size:clamp(14px,1.6vw,18px)}
#side p{margin:0 0 8px;font-size:13px;color:#cfc8e0}
#pos{display:grid;grid-template-columns:1fr;gap:5px}
#pos button{font:inherit;font-weight:800;font-size:clamp(12px,1.3vw,15px);border:0;border-radius:12px;padding:5px;min-height:34px;background:#ffffff1f;color:#fff;cursor:pointer}
#pos button.right{background:#2fbf5b}#pos button.wrong{background:#e5394a}
#tog{font:inherit;font-weight:800;border:0;border-radius:12px;background:#ffffff2a;color:#fff;min-height:34px;width:100%;cursor:pointer;margin-bottom:6px}
#ans{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#0f1320d9;border-radius:18px;padding:6px 10px;min-height:56px}
#reveal{font:inherit;font-weight:800;font-size:clamp(14px,1.6vw,18px);border:2px dashed #ffffff66;background:none;color:#e8e3f5;border-radius:14px;padding:6px 14px;min-height:42px;cursor:pointer}
#answer{font-weight:800;font-size:clamp(20px,3.4vw,36px);letter-spacing:.12em;color:#fff6a8;text-shadow:0 0 10px #ffd84d}
#msg{font-weight:800;font-size:clamp(14px,1.6vw,18px);color:#cfc8e0}
/* letter table */
#table{display:none;flex:1;min-width:0;min-height:0;gap:10px;align-items:center;justify-content:center;container-type:size}
#table.show{display:flex}
#big{height:92cqh;width:min(32cqw,60cqh);position:relative;flex:none}
#big .L{width:100%;height:100%}
#cells{flex:1;max-width:820px;height:92cqh;display:grid;gap:8px;grid-template-columns:repeat(2,1fr);align-content:center}
.cell{font:inherit;font-weight:800;font-size:clamp(14px,2.2vw,24px);border:0;border-radius:16px;background:#0f1320d9;color:#fff;cursor:pointer;padding:8px;min-height:48px;box-shadow:inset 0 0 0 2px #ffffff33;display:block;text-align:center;line-height:1.25}
.cell b{color:var(--c);text-shadow:0 0 8px var(--c)}
.cell.done{background:#1f8f42e6;box-shadow:inset 0 0 0 3px #7ff0a0}
.cell.done::after{content:"\2713";font-size:1.2em}
@media (max-aspect-ratio:1/1){#side{position:fixed;right:6px;left:6px;top:auto;bottom:84px;width:auto;max-height:46vh;overflow:auto}#side #pos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}#side #pos button{padding:6px 2px;font-size:13px}#table{flex-direction:column}#big{height:38cqh;width:30cqh}#cells{height:auto;width:100%}}
@media (min-aspect-ratio:3/2){#cells{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="top"><a class="home" href="../../index.html">Home</a><h1 id="title">Alphabet Lights</h1>
 <div class="seg" id="game"><button data-g="seq">Sequence</button><button data-g="spell">Spelling</button><button data-g="table">Letter Table</button></div>
 <div class="seg" id="lvl"></div><div class="seg" id="diff"></div>
 <button class="ctl go" id="play">Play</button><span id="score">Score 0</span></div>
<div id="main"><div id="stage"></div><div id="table"><div id="big"></div><div id="cells"></div></div>
 <div id="side"><button id="tog">Bonus</button><h3>Bonus: word type</h3><p>What kind of word is it?</p><div id="pos"></div><button class="ctl" id="skip" style="width:100%;margin-top:8px">Skip</button></div></div>
<div id="ans"><button id="reveal">Teacher: tap to show answer</button><span id="answer"></span><span id="msg"></span><button class="ctl ok" id="yes" title="Correct">&#10003; Correct</button><button class="ctl no" id="noB" title="Try again">&#10007; Try again</button></div>
<script src="data.js"></script><script>
(function(){
const A=window.AL,Q=s=>document.querySelector(s),ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const COL={A:"#ff2d95",B:"#1e7bff",C:"#9dff1e",D:"#ff8a00",E:"#ffe100",F:"#b13cff",G:"#ff1e1e",H:"#00f0ff",I:"#ff2d95",J:"#9dff1e",K:"#ff8a00",L:"#1e7bff",M:"#ffe100",N:"#b13cff",O:"#ff1e1e",P:"#00f0ff",Q:"#9dff1e",R:"#ff2d95",S:"#ff8a00",T:"#1e7bff",U:"#ffe100",V:"#b13cff",W:"#9dff1e",X:"#ff1e1e",Y:"#00f0ff",Z:"#ff2d95"};
const prm=new URLSearchParams(location.search);
let G=["seq","spell","table"].includes(prm.get("g"))?prm.get("g"):"seq",lvl=null,diff="A1",score=0,cur=null,busy=false,timers=[];
const el={};
function letter(c){const d=document.createElement("div");d.className="L";d.style.setProperty("--c",COL[c]);d.innerHTML=`<img class="off" src="off-${c}.webp" alt="${c}"><img class="on" src="on-${c}.webp" alt="">`;return d}
[[0,9],[9,18],[18,26]].forEach(([a,b])=>{const r=document.createElement("div");r.className="row";for(let i=a;i<b;i++){const d=letter(ABC[i]);el[ABC[i]]=d;r.appendChild(d)}Q("#stage").appendChild(r)});
const big=letter("A");Q("#big").appendChild(big);
const T=(f,ms)=>timers.push(setTimeout(f,ms));
function stop(){timers.forEach(clearTimeout);timers=[];busy=false;Object.values(el).forEach(d=>d.className="L")}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seg(id,items,val,cb){const s=Q(id);s.innerHTML=items.map(([v,t])=>`<button data-v="${v}" class="${v==val?"on":""}">${t}</button>`).join("");s.onclick=e=>{const b=e.target.closest("button");if(!b)return;s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));cb(b.dataset.v)}}
function setScore(n){score=n;Q("#score").textContent="Score "+score}
function resetAns(){Q("#answer").textContent="";Q("#msg").textContent="";Q("#reveal").style.display="";}
function setup(){
 stop();resetAns();cur=null;Q("#side").classList.remove("show");
 Q("#game").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.g===G));
 const isT=G==="table";Q("#stage").style.display=isT?"none":"";Q("#table").classList.toggle("show",isT);
 if(G==="seq"){lvl=lvl&&+lvl<=8?lvl:"2";seg("#lvl",[2,3,4,5,6,7,8].map(n=>[n,"Level "+(n-1)]),lvl,v=>{lvl=v;setup()});Q("#diff").style.display="none"}
 else if(G==="spell"){lvl=lvl&&+lvl>=3&&+lvl<=7?lvl:"3";seg("#lvl",[3,4,5,6,7].map(n=>[n,n+" letters"]),lvl,v=>{lvl=v;setup()});Q("#diff").style.display="";seg("#diff",[["A1","A1"],["A2","A2"],["B1","B1"]],diff,v=>{diff=v;setup()})}
 else{Q("#lvl").innerHTML="";Q("#lvl").style.display="none";Q("#diff").style.display="";seg("#diff",[["A1","A1"],["A2","A2"],["B1","B1"]],diff,v=>{diff=v;setup()})}
 if(G!=="table")Q("#lvl").style.display="";
 Q("#play").textContent=G==="table"?"New letter":"Play";
 Q("#reveal").textContent=G==="table"?"Teacher: tap a box when the answer is right":"Teacher: tap to show answer";
 Q("#yes").style.display=Q("#noB").style.display=G==="table"?"none":"";
 if(G==="table"){Q("#cells").innerHTML="";big.className="L";}
 history.replaceState(null,"","?g="+G);
}
function flash(seq,on,gap){busy=true;let t=300;
 seq.forEach(c=>{const d=el[c];T(()=>{d.className="L lit"},t);T(()=>{d.className="L out"},t+on);T(()=>{d.className="L"},t+on+380);t+=on+gap});
 T(()=>{busy=false;Q("#msg").textContent="Say it!"},t)}
function play(){
 if(busy)return;stop();resetAns();Q("#side").classList.remove("show");
 if(G==="seq"){const n=+lvl,s=[];while(s.length<n){const c=rnd(ABC.split(""));if(s[s.length-1]!==c)s.push(c)}cur={ans:s.join(" ")};flash(s,1000,350)}
 else if(G==="spell"){const list=A.words[diff][lvl].split(",").map(x=>x.split(" "));let w;do{w=rnd(list)}while(cur&&list.length>1&&cur.w===w[0]);
  cur={w:w[0],p:w[1],ans:w[0].toUpperCase()};flash(cur.ans.split(""),620,120)}
 else table();
}
function table(){
 const L=A.levels[diff],all=[...L.base,...L.extra],pool=ABC.split("").filter(c=>all.filter(p=>A.P[p][1].includes(c)).length>=L.min);
 let c;do{c=rnd(pool)}while(cur&&pool.length>1&&cur.c===c);cur={c};
 big.style.setProperty("--c",COL[c]);big.innerHTML=`<img class="off" src="off-${c}.webp" alt="${c}"><img class="on" src="on-${c}.webp" alt="">`;
 big.className="L";requestAnimationFrame(()=>big.className="L lit");
 const base=L.base.filter(p=>A.P[p][1].includes(c)),ex=shuffle(L.extra.filter(p=>A.P[p][1].includes(c)));
 const ps=base.concat(ex).slice(0,L.cells);const cells=Q("#cells");cells.style.setProperty("--c",COL[c]);
 cells.style.gridTemplateColumns=ps.length>6?"repeat(2,1fr)":"repeat(2,1fr)";
 cells.innerHTML=ps.map(p=>`<button class="cell">Give me ${A.P[p][0]} starting with <b>${c}</b></button>`).join("");
 cells.onclick=e=>{const b=e.target.closest(".cell");if(!b)return;b.classList.toggle("done");setScore(score+(b.classList.contains("done")?1:-1))};
}
Q("#reveal").onclick=()=>{if(G==="table"||!cur||busy)return;Q("#answer").textContent=cur.ans;Q("#reveal").style.display="none"};
Q("#yes").onclick=()=>{if(!cur||busy||cur.marked)return;cur.marked=1;setScore(score+1);Q("#msg").textContent="Great!";
 Object.values(el).forEach(d=>{}); (G==="spell"?cur.ans.split(""):cur.ans.split(" ")).forEach(c=>el[c].className="L stay");
 if(G==="spell"&&diff==="B1"){const s=Q("#side");s.classList.add("show");s.classList.remove("closed");Q("#pos").innerHTML=Object.entries(A.pos).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join("")}};
Q("#noB").onclick=()=>{if(!cur||busy)return;Q("#msg").textContent="Try again!";Q("#answer").textContent=cur.ans;Q("#reveal").style.display="none"};
Q("#pos").onclick=e=>{const b=e.target.closest("button");if(!b||!cur||cur.posDone)return;cur.posDone=1;
 const r=b.dataset.k===cur.p;b.classList.add(r?"right":"wrong");if(!r)Q(`#pos [data-k="${cur.p}"]`).classList.add("right");if(r)setScore(score+1);Q("#msg").textContent=r?"Bonus point!":cur.w+" is a "+A.pos[cur.p]};
Q("#skip").onclick=()=>Q("#side").classList.remove("show");
Q("#tog").onclick=()=>Q("#side").classList.toggle("closed");
Q("#play").onclick=play;
Q("#game").onclick=e=>{const b=e.target.closest("button");if(!b)return;G=b.dataset.g;lvl=null;setup()};
setup();
})();
</script></body></html>
