.row::before{content:"";position:absolute;left:1%;right:1%;bottom:1.6cqh;height:max(3px,.45cqw);background:url(cable.webp) center/auto 100% repeat-x;background:#0b0b0b;border-radius:3px;opacity:.85;z-index:2}
