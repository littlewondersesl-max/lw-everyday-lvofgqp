<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#140c06">
  <title>Save Sam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <section id="screen-title" class="screen title-screen">
      <img class="bleed" src="img/sam-title.png" alt="">
      <div class="vignette" aria-hidden="true"></div>
      <div class="dust" aria-hidden="true"></div>
      <div class="title-block">
        <h1 class="paint" aria-label="Save Sam">
          <span class="paint-row">
            <b>S</b><b>A</b><b>V</b><b>E</b>
          </span>
          <span class="paint-row paint-sam">
            <b>S</b><b>A</b><b>M</b>
          </span>
        </h1>
        <button type="button" id="btn-start" class="patch">
          <span class="patch-holes" aria-hidden="true"></span>
          <span class="patch-label">Start</span>
        </button>
      </div>
    </section>

    <section id="screen-play" class="screen play-screen hidden">
      <div id="scene">
        <img id="scene-base" class="scene-layer on" alt="">
        <img id="scene-still-a" class="scene-layer" alt="">
        <img id="scene-still-b" class="scene-layer" alt="">
        <video id="scene-video" class="scene-layer" playsinline webkit-playsinline muted></video>
        <div id="placeholder" class="scene-layer placeholder"></div>
      </div>

      <div id="word-box" class="word-box">
        <button type="button" id="btn-scoop" class="scoop" aria-label="Put the little words back">
          <svg viewBox="0 0 80 100" aria-hidden="true">
            <path d="M38 98c-3 0-5-2-5-7V52" stroke="#2a1a0c" stroke-width="9" stroke-linecap="round" fill="none"/>
            <path d="M38 98c-3 0-5-2-5-7V52" stroke="#a86a30" stroke-width="4.2" stroke-linecap="round" fill="none"/>
            <path d="M14 40c2-22 18-34 36-34s34 12 36 34c2 16-10 28-36 28S12 56 14 40z" fill="#e8d39a" stroke="#2a1a0c" stroke-width="3.4"/>
            <path d="M22 36c4 14 14 20 28 18" fill="none" stroke="#2a1a0c" stroke-width="2" stroke-dasharray="4 3"/>
            <path d="M26 22c10 8 22 8 32-2" fill="none" stroke="#6a4a20" stroke-width="1.6" opacity=".5"/>
            <circle cx="50" cy="24" r="3" fill="#2a1a0c" opacity=".25"/>
          </svg>
        </button>
        <div id="zero-g" class="zero-g"></div>
      </div>

      <div id="marks" class="marks" aria-hidden="true"><i></i><i></i><i></i></div>

      <div id="tray" class="tray">
        <div class="tray-lip" aria-hidden="true"></div>
        <div id="slot-verb" class="well well-verb" data-empty="true"></div>
        <div id="slot-little" class="well well-little" data-empty="true"></div>
        <div id="slot-noun" class="well well-noun" data-empty="true"></div>
      </div>

      <button type="button" id="btn-pack" class="pack" aria-label="Backpack">
        <svg viewBox="0 0 120 148" aria-hidden="true">
          <path d="M28 44c0-18 16-30 32-30s32 12 32 30" fill="none" stroke="#2a1a0c" stroke-width="7" stroke-linecap="round"/>
          <path d="M28 44c0-18 16-30 32-30s32 12 32 30" fill="none" stroke="#6b3e1e" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M14 58c0-10 8-18 18-18h56c10 0 18 8 18 18v62c0 14-10 24-24 24H38c-14 0-24-10-24-24V58z" fill="#6b3a1c"/>
          <path d="M14 58c0-10 8-18 18-18h56c10 0 18 8 18 18v62c0 14-10 24-24 24H38c-14 0-24-10-24-24V58z" fill="url(#packShade)" stroke="#2a1a0c" stroke-width="3.4"/>
          <path d="M20 72h80v38c0 10-8 18-18 18H38c-10 0-18-8-18-18V72z" fill="#5a3016" stroke="#2a1a0c" stroke-width="2.2"/>
          <path d="M22 50h76c6 0 10 4 10 9v10H12V59c0-5 4-9 10-9z" fill="#8a4e24" stroke="#2a1a0c" stroke-width="2.6"/>
          <path d="M48 56h24v10H48z" fill="#c48a2a" stroke="#2a1a0c" stroke-width="2"/>
          <circle cx="52" cy="61" r="2.2" fill="#2a1a0c"/>
          <circle cx="68" cy="61" r="2.2" fill="#2a1a0c"/>
          <path d="M30 86h60" stroke="#2a1a0c" stroke-width="1.4" stroke-dasharray="3 4" opacity=".55"/>
          <path d="M30 98h60" stroke="#2a1a0c" stroke-width="1.4" stroke-dasharray="3 4" opacity=".4"/>
          <defs>
            <linearGradient id="packShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8a4e24"/>
              <stop offset="1" stop-color="#4a2410"/>
            </linearGradient>
          </defs>
        </svg>
      </button>

      <div id="hotspots" class="hotspots hidden"></div>
      <img id="bird-bob" class="bird-bob hidden" alt="">
      <div id="hover-pop" class="hover-pop hidden" aria-hidden="true">
        <div class="hp-art"><img alt=""></div>
        <div class="hp-word"></div>
      </div>
      <button type="button" id="btn-forward" class="fwd hidden" aria-label="Go forward">▶</button>
      <div id="deck" class="deck icon-rail"></div>
      <div id="inspect-dim" class="inspect-dim" aria-hidden="true"></div>
      <div id="stamp" class="stamp hidden" role="status"></div>
    </section>

    <section id="screen-safe" class="screen safe-screen hidden">
      <img class="bleed" src="img/s3-win.png" alt="">
      <div class="vignette" aria-hidden="true"></div>
      <div class="title-block safe-block">
        <h2 class="paint" aria-label="Sam is safe">
          <span class="paint-row paint-sam"><b>S</b><b>A</b><b>M</b></span>
          <span class="paint-row paint-small"><b>I</b><b>S</b></span>
          <span class="paint-row"><b>S</b><b>A</b><b>F</b><b>E</b><b>!</b></span>
        </h2>
        <button type="button" id="btn-again" class="patch">
          <span class="patch-holes" aria-hidden="true"></span>
          <span class="patch-label">Again</span>
        </button>
      </div>
    </section>

  </div>
  <script src="game.js"></script>
</body>
</html>
